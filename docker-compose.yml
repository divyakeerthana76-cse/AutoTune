services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autotune
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autotune"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build: ./ml-service
    working_dir: /app
    command: sh -c "python train.py && uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service:/app

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/autotune
      ML_SERVICE_URL: http://ml:8000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
